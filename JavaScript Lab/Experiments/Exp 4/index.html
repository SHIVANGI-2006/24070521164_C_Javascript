<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Palindrome Checker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:Poppins,sans-serif;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(#8B5E3C,#5C4033);

overflow:hidden;

}

/* Wooden Table */

body::before{

content:"";

position:absolute;

width:100%;
height:100%;

background-image:
linear-gradient(rgba(255,255,255,.02) 2px,transparent 2px),
linear-gradient(90deg,rgba(255,255,255,.02) 2px,transparent 2px);

background-size:60px 60px;

opacity:.4;

}

/* Book */

.book{

position:relative;

width:470px;

padding:35px;

background:#FFFDF5;

border-radius:8px;

box-shadow:

0 20px 50px rgba(0,0,0,.35);

border-left:18px solid #C49A6C;

}

.book::before{

content:"";

position:absolute;

left:50%;

top:0;

width:3px;

height:100%;

background:#e5d5b7;

}

.book::after{

content:"";

position:absolute;

left:48%;

top:0;

width:1px;

height:100%;

background:#d9c29c;

}

.icon{

font-size:55px;

text-align:center;

margin-bottom:8px;

}

h1{

font-family:Merriweather,serif;

text-align:center;

color:#5C4033;

margin-bottom:8px;

}

.subtitle{

text-align:center;

color:#777;

font-size:14px;

margin-bottom:25px;

}

label{

font-weight:600;

color:#5C4033;

}

input{

margin-top:8px;

width:100%;

padding:14px;

font-size:16px;

border:2px solid #C49A6C;

border-radius:8px;

outline:none;

background:#fff;

}

input:focus{

border-color:#8B5E3C;

}

button{

margin-top:20px;

width:100%;

padding:14px;

background:#8B5E3C;

color:white;

border:none;

border-radius:8px;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#6F4E37;

transform:translateY(-2px);

}

#result{

display:none;

margin-top:25px;

padding:18px;

border-radius:8px;

font-weight:600;

animation:fade .4s;

}

.success{

background:#EAF8E6;

border-left:8px solid green;

color:#146C2E;

}

.fail{

background:#FFE9E9;

border-left:8px solid red;

color:#B00020;

}

.error{

background:#FFF5D7;

border-left:8px solid orange;

color:#9C6500;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(15px);

}

to{

opacity:1;

transform:translateY(0);

}

}

footer{

margin-top:20px;

text-align:center;

font-size:12px;

color:#777;

}

</style>

</head>

<body>

<div class="book">

<div class="icon">📚</div>

<h1>Palindrome Dictionary</h1>

<p class="subtitle">

Search whether a word reads the same from both directions.

</p>

<label>Enter Word</label>

<input

type="text"

id="text"

placeholder="Example : Madam">

<button onclick="checkPalindrome()">

📖 Search Word

</button>

<div id="result"></div>

<footer>

Dictionary Based Palindrome Checker

</footer>

</div>

<script src="script.js"></script>

</body>

</html>
