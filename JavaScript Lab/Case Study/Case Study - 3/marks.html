<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Marks Entry</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="card">
  <h1>Student Marks Entry</h1>
  <p class="subtitle">Enter the marks for each subject to generate the grade card.</p>

  <form id="marksForm">
    <label>Computer Networks</label>
    <input type="number" id="cn" min="0" max="100" required>

    <label>Compiler Construction</label>
    <input type="number" id="cc" min="0" max="100" required>

    <label>Data Compression</label>
    <input type="number" id="dc" min="0" max="100" required>

    <label>Agentic AI</label>
    <input type="number" id="ai" min="0" max="100" required>

    <label>Flexi-credit JavaScript</label>
    <input type="number" id="js" min="0" max="100" required>

    <label>Soft Computing (Specialization)</label>
    <input type="number" id="sc" min="0" max="100" required>

    <button type="submit">Generate Grade Card</button>
  </form>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
