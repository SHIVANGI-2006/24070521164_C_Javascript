<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Strength Checker</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:#050816;

overflow:hidden;

}

/* Animated Background */

body::before{

content:"";

position:absolute;

width:100%;
height:100%;

background:
linear-gradient(rgba(0,255,150,.08) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,150,.08) 1px, transparent 1px);

background-size:45px 45px;

animation:gridMove 10s linear infinite;

}

@keyframes gridMove{

0%{transform:translateY(0);}
100%{transform:translateY(45px);}

}

.card{

position:relative;

width:430px;

padding:35px;

background:#0f172a;

border:2px solid #00ff99;

border-radius:18px;

box-shadow:
0 0 20px #00ff99,
0 0 60px rgba(0,255,150,.2);

text-align:center;

overflow:hidden;

z-index:1;

}

.scan{

position:absolute;

left:0;

top:0;

width:100%;

height:4px;

background:#00ff99;

box-shadow:0 0 15px #00ff99;

animation:scan 3s linear infinite;

}

@keyframes scan{

0%{top:0;}

50%{top:96%;}

100%{top:0;}

}

.icon{

font-size:60px;

margin-bottom:10px;

}

h1{

color:#00ff99;

margin-bottom:5px;

}

.subtitle{

color:#cbd5e1;

font-size:14px;

margin-bottom:25px;

}

input{

width:100%;

padding:15px;

background:#111827;

border:2px solid #00ff99;

outline:none;

color:white;

font-size:16px;

border-radius:10px;

transition:.3s;

}

input:focus{

box-shadow:0 0 20px #00ff99;

}

button{

margin-top:20px;

width:100%;

padding:15px;

background:#00ff99;

color:black;

font-size:17px;

font-weight:bold;

border:none;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:white;

transform:scale(1.03);

box-shadow:0 0 25px #00ff99;

}

#result{

display:none;

margin-top:25px;

padding:18px;

border-radius:12px;

font-weight:bold;

font-size:18px;

}

.weak{

background:#ff3b30;

color:white;

border:2px solid white;

}

.strong{

background:#00c853;

color:white;

border:2px solid white;

}

.error{

background:#ff9800;

color:white;

}

footer{

margin-top:18px;

color:#94a3b8;

font-size:12px;

}

</style>

</head>

<body>

<div class="card">

<div class="scan"></div>

<div class="icon">🔒</div>

<h1>Password Strength Checker</h1>

<p class="subtitle">

Cyber Security Password Validator

</p>

<input

type="password"

id="password"

placeholder="Enter Secure Password">

<button onclick="checkPassword()">

Analyze Password

</button>

<div id="result"></div>

<footer>

JavaScript Practical Project

</footer>

</div>

<script src="script.js"></script>

</body>
